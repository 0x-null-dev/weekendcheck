services:
  web:
    build: .
    image: weekendcheck:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      WEEKENDCHECK_DATA_DIR: /app/.weekendcheck
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/app/.weekendcheck
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 12s
      retries: 3
  scheduler:
    image: weekendcheck:local
    profiles: ["scheduler"]
    restart: unless-stopped
    command: ["npm", "run", "scheduler"]
    env_file: .env
    environment:
      NODE_ENV: production
      WEEKENDCHECK_DATA_DIR: /app/.weekendcheck
    volumes:
      - media:/app/.weekendcheck
    depends_on:
      web:
        condition: service_healthy
volumes:
  media:
